version: '3.8'

services:
  web:
    build: .
    ports:
      - "80:8000" 
    restart: always
    environment:
      - DB_NAME=postgres
      - DB_USER=dbadmin
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=5432
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DEBUG=False
      - ALLOWED_HOSTS=* 